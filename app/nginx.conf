server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Até 8 fotos de 5 MB no cadastro de item (com folga para o multipart).
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Fotos dos itens: arquivos crus no volume compartilhado com a API, servidos aqui
    # (sem passar pelo Node). O nome tem um uuid, então nunca muda: cache de 1 ano.
    location ^~ /uploads/.tmp/ {
        return 404;
    }
    location /uploads/ {
        alias /srv/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # JS/CSS do Vite têm hash no nome: cache longo.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Socket.IO (mesmo host, repassado para a API).
    location /socket.io/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Rotas da API (o front usa VITE_API_URL apontando para este mesmo host).
    location ~ ^/(user|auth|item|auction|health)(/|$) {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Upload de fotos vai direto para a API (que grava no disco), sem cópia no nginx.
        proxy_request_buffering off;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
