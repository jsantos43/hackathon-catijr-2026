name: leilao

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leilao}
      POSTGRES_DB: ${POSTGRES_DB:-leilao}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LEGADO: as fotos agora ficam no disco (api/uploads). O MinIO só sobe com
  # `docker compose --profile legado up -d minio`, para importar fotos antigas uma vez
  # (`docker compose exec api npm run photos:import`, ver README).
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    profiles: ["legado"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Console web
    volumes:
      - minio_data:/data

  # API em modo dev, sem build de imagem: a pasta ./api é montada direto no container
  # (bind mount), então editar um arquivo no host recarrega a API na hora (tsx watch).
  api:
    image: node:24-slim
    working_dir: /app
    # Mesmo usuário do host, para os arquivos criados pelo container (node_modules,
    # client do Prisma) não ficarem como root na sua pasta.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: >
      sh -c "[ -d node_modules ] || npm ci;
             npx prisma generate &&
             npx prisma migrate deploy &&
             npm run dev"
    volumes:
      - ./api:/app
    env_file:
      - path: ./api/.env
        required: false
    # Sobrescreve o que no api/.env aponta para localhost: dentro da rede do compose
    # os serviços se chamam pelo nome.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leilao}:${POSTGRES_PASSWORD:-leilao}@postgres:5432/${POSTGRES_DB:-leilao}?schema=public
      REDIS_URL: redis://redis:6379
      # Fotos em ./api/uploads (montada em /app); a API serve /uploads em dev.
      UPLOADS_DIR: /app/uploads
      UPLOADS_PUBLIC_URL: http://localhost:${API_PORT:-3333}/uploads
      MINIO_URL: http://minio:9000/auction-photos
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Front (Vite) em modo dev, mesmo esquema da API: ./app montada no container, hot reload.
  # VITE_API_URL é lida pelo navegador, então continua apontando para localhost:3333.
  app:
    image: node:24-slim
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: >
      sh -c "[ -d node_modules ] || npm ci;
             npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    volumes:
      - ./app:/app
    env_file:
      - path: ./app/.env
        required: false
    ports:
      - "${APP_PORT:-5173}:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
